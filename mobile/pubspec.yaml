name: kickly_app
description: "Kickly - leghe e partite di calcio amatoriale."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cached_network_image: 3.4.1
  cupertino_icons: 1.0.9
  go_router: 18.0.0
  image_picker: 1.2.3
  http: 1.6.0
  intl: 0.20.3
  supabase_flutter: 2.17.2
  url_launcher: 6.3.2
  # Banner di sistema veri (non SnackBar) e canale notifiche Android brandizzato.
  flutter_local_notifications: 19.4.2
  # Task periodico che controlla le notifiche non lette ad app chiusa, così il
  # telefono avvisa anche senza un canale push FCM/APNs configurato.
  workmanager: 0.10.9
  # Sessione Supabase e cursore dell'ultima notifica letti dal task in background,
  # che gira in un isolate separato senza accesso allo stato dell'app.
  shared_preferences: 2.5.5
  # Keychain (iOS) / Keystore (Android) per i token di sessione Supabase: senza
  # questo finiscono in SharedPreferences/NSUserDefaults in chiaro.
  flutter_secure_storage: 10.3.1
  # Sign in with Google, flusso nativo con ID token verificato da Supabase.
  google_sign_in: 7.2.0
  # Sign in with Apple, obbligatorio su iOS se si offre un altro login social.
  sign_in_with_apple: 8.1.0
  # Hash del nonce nel flusso Apple (vedi kickly_repository.dart).
  crypto: 3.0.7
  # Lettura/scrittura degli eventi sul calendario di sistema (iOS e Android).
  # Resta pinnata alla 3.x: dalla 4.3.0 il pacchetto richiede `timezone ^0.9.0`,
  # mentre qui flutter_local_notifications porta già `timezone ^0.10.1`, quindi
  # le versioni successive non risolvono.
  device_calendar: ^3.9.0
  # Serve al logomark ufficiale di Google sul pulsante "Continua con Google"
  # (auth_page.dart): il logo è 4 path a colori diversi, troppo per un'icona
  # Material o un CustomPainter scritto a mano senza rischiare di sbagliare le
  # curve.
  flutter_svg: 2.3.0

# Copia vendorizzata di device_calendar 3.9.0: il lato Android del pacchetto
# pubblicato NON è utilizzabile con Flutter/AGP attuali, per due motivi
# distinti (entrambi risolti nella copia, il lato Dart e iOS è invariato):
#
# 1. Build. Il suo `android/build.gradle` dichiara `jcenter()`, un repository
#    Maven ritirato da anni che Gradle 9 non espone più: la build falliva in
#    configurazione, prima ancora di compilare (è l'errore su cui si fermava
#    il job CI "Android (APK debug)"). Aggiornati anche namespace, compileSdk,
#    minSdk e JVM target, tutti fermi al 2019 e rifiutati da AGP 9.
#
# 2. Runtime. Il plugin si registrava solo con la "v1 embedding"
#    (`registerWith(Registrar)`), rimossa dall'engine Flutter: oltre a non
#    compilare più, non veniva nemmeno inserito in GeneratedPluginRegistrant,
#    quindi su Android ogni chiamata sarebbe fallita con MissingPluginException
#    anche a build riuscita. È stato portato a FlutterPlugin + ActivityAware.
#
# Perché non aggiornare invece la dipendenza: dalla 4.3.0 il pacchetto richiede
# `timezone ^0.9.0`, mentre l'app ha già `timezone ^0.10.1` portata da
# flutter_local_notifications, quindi le major successive non risolvono.
# Da rimuovere se/quando quel vincolo si sbloccherà.
dependency_overrides:
  device_calendar:
    path: third_party/device_calendar-3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # Geist, lo stesso font della PWA (next/font/google in src/app/layout.tsx).
  # Non è nel catalogo Google Fonts, quindi i file vanno impacchettati qui:
  # sono i TTF statici del release ufficiale vercel/geist-font, licenza
  # SIL OFL 1.1 (assets/fonts/LICENSE.txt).
  # Pesi statici e non variabile: in Flutter il mapping di fontWeight su un
  # font variabile dipende dalla piattaforma, con i pesi dichiarati uno a uno
  # il risultato è identico ovunque.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/kickly-icon.png
  adaptive_icon_background: "#0B0D0C"
  adaptive_icon_foreground: assets/images/kickly-icon.png
  remove_alpha_ios: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Splash screen nativo (Android/iOS), generato da `dart run
# flutter_native_splash:create`. Sostituisce lo sfondo bianco/nero di
# default che il sistema operativo mostra PRIMA che il motore Flutter sia
# pronto a disegnare il primo frame: senza questo pacchetto non c'è alcun
# modo di brandizzare quella schermata, perché a quel punto Dart non gira
# ancora (è codice nativo — storyboard su iOS, drawable/tema su Android).
flutter_native_splash:
  # Stesso colore di `AppTheme.background` (lib/core/theme/app_theme.dart),
  # così la schermata nativa e la prima schermata Flutter (SplashPage) sono
  # indistinguibili e la transizione non "scatta".
  color: "#0B0D0C"
  # Stessa icona usata da flutter_launcher_icons qui sopra: ha già lo sfondo
  # scuro arrotondato incorporato, quindi funziona bene sia da sola (qui)
  # sia ritagliata in un cerchio (vedi android_12 sotto).
  image: assets/images/kickly-icon.png
  # Nasconde la status/notification bar durante lo splash: su Android
  # evita che una barra di sistema "anonima" stoni con lo sfondo scuro
  # brandizzato; su iOS è già nascosta di default.
  fullscreen: true

  # Android 12+ ha un meccanismo di splash screen diverso (SplashScreen API
  # di sistema, non più storyboard/drawable custom) e va configurato a
  # parte: senza questa sezione, su Android 12+ verrebbe mostrata solo
  # l'icona di lancio su sfondo di sistema, ignorando `color`/`image` sopra.
  android_12:
    color: "#0B0D0C"
    image: assets/images/kickly-icon.png
    # Stesso colore dello sfondo generale: l'icona ha già i bordi
    # arrotondati e lo sfondo scuro disegnati dentro l'immagine, quindi lo
    # sfondo del cerchio Android 12 deve solo "sparire" dietro di essa
    # invece di introdurre un colore diverso attorno.
    icon_background_color: "#0B0D0C"
