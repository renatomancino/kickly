# Aggiornamento automatico delle dipendenze.
#
# PERCHE' SERVE: il job `npm audit` in ci.yml segnala una vulnerabilità quando è
# già lì, ma non la risolve, e nessuno apre un aggiornamento di sua iniziativa fra
# una funzionalità e l'altra. Dependabot apre la PR da solo, la CI la verifica, e
# aggiornare diventa una cosa che si fa in due minuti invece che un progetto a sé
# dopo un anno di rinvii.
#
# DA SAPERE: questo file governa gli *aggiornamenti di versione*. Gli *avvisi di
# sicurezza* (Dependabot alerts) sono invece un interruttore nelle impostazioni del
# repository e vanno attivati a parte, da chi ha permessi di amministratore.
version: 2

updates:
  # --- PWA Next.js (package.json alla radice) ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Raggruppate per non ritrovarsi quindici PR aperte il lunedì mattina: le
    # patch e le minor entrano tutte insieme, perché è raro che una singola meriti
    # una revisione a sé.
    groups:
      npm-minori:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # I major restano manuali: su Next.js e React un salto di major significa
      # cambi di API e va pianificato, non subito il lunedì da un bot.
      - dependency-name: 'next'
        update-types: [version-update:semver-major]
      - dependency-name: 'react'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major]

      # I tre qui sotto non sono preferenze: sono vincoli verificati, ognuno
      # con la PR che lo ha dimostrato. Senza queste righe Dependabot li
      # ripropone ogni lunedì e ogni lunedì la CI li boccia.

      # eslint 10 (PR #5, job PWA rosso): `eslint-config-next` si porta dietro
      # `eslint-plugin-import`, che dichiara supporto a ESLint fino alla 9.
      # Tornerà adottabile insieme a un major di eslint-config-next.
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]

      # typescript 7 (PR #8, job PWA rosso): `typescript-eslint`, anch'esso
      # tirato dentro da eslint-config-next, accetta TypeScript solo sotto la
      # 6.1. E comunque un major del compilatore va fatto leggendo le note di
      # rilascio, non in automatico.
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]

      # @types/node deve seguire il major del Node che eseguiamo davvero
      # (`engines: >=22.13.0`, CI su Node 22), non l'ultimo pubblicato. Tipi più
      # avanti del runtime sono peggio che tipi vecchi: TypeScript accetta API
      # che a runtime non esistono, quindi il typecheck passa e l'app crasha.
      # Questo era già successo — vedi PR #7, mergiata e poi riportata a ^22.
      # Va alzato a mano, insieme a `engines` e a NODE_VERSION nella CI.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # --- App Flutter (mobile/pubspec.yaml) ---
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      pub-minori:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Entrambe sono pinnate DELIBERATAMENTE per risolvere build Android
      # realmente rotte: flutter_secure_storage 11 punta a un'API level Android
      # che non esiste, e flutter_local_notifications è indietro di più major.
      # Un aggiornamento automatico qui rimetterebbe la build nello stato da cui
      # siamo usciti; vanno alzate a mano, con un test su device vero.
      - dependency-name: 'flutter_secure_storage'
      - dependency-name: 'flutter_local_notifications'

  # --- Action usate nei workflow ---
  # Le action invecchiano in silenzio: è già successo in questo repo, con tre
  # action ferme su Node 20 che i runner forzavano su Node 24 con un avviso di
  # deprecazione. Con questa voce l'avviso diventa una PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
