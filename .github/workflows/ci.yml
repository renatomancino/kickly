# Pipeline CI di Kickly.
#
# CONTESTO CHE VINCOLA IL DESIGN DI QUESTO FILE
# Le PR arrivano dal fork `mariocelzo/kickly` verso l'upstream `renatomancino/kickly`.
# GitHub esegue i workflow delle PR da fork in modalita' ridotta: nessun secret e'
# esposto e il GITHUB_TOKEN e' in sola lettura. Di conseguenza ogni job qui sotto e'
# progettato per funzionare a secchio vuoto: nessuno legge un secret, nessuno pubblica
# artefatti firmati, nessuno scrive sul repo. Se in futuro serve un job che richiede
# credenziali (deploy, upload su Play Store, coverage su servizio esterno), quel job NON
# puo' stare qui: va in un workflow separato con trigger `push` sul branch main
# dell'upstream, dove i secrets esistono davvero.
#
# Non usiamo `pull_request_target` di proposito. Quel trigger esegue la definizione del
# workflow del branch base MA con i secrets del repo, mentre il codice della PR e' quello
# non fidato: e' il vettore documentato con cui una PR ostile si fa esfiltrare i segreti.
# `pull_request` e' l'unico trigger corretto per un repo che accetta contributi da fork.
name: CI

on:
  # Gate vero: tutto deve essere verde prima del merge in main.
  pull_request:
    branches: [main]
  # I branch di lavoro girano gia' sul fork, PRIMA di aprire la PR. Costa poco (repo
  # pubblici, minuti Actions gratuiti) ed evita il caso peggiore: scoprire che la build
  # e' rotta quando la review e' gia' iniziata e il contesto mentale e' su altro.
  push:
    branches: ['claude/**']

# Least privilege esplicito. Nessun job di questa pipeline scrive nulla: dichiararlo qui
# vale anche come documentazione, e impedisce che un job aggiunto domani erediti per
# sbaglio permessi di scrittura dal default del repository.
permissions:
  contents: read

# Un push nuovo sullo stesso branch/PR annulla il run precedente, che a quel punto sta
# validando codice gia' superato. Il gruppo usa il numero di PR quando c'e' (cosi' i push
# successivi sulla stessa PR si annullano fra loro) e il ref altrimenti.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Stessa versione dell'ambiente di sviluppo (`flutter --version` -> 3.47.0, Dart 3.13.0,
  # coerente con `environment: sdk: ^3.13.0` in mobile/pubspec.yaml). Pinnata e non
  # "stable" flottante: un bump di Flutter cambia lint, formatter e AGP supportato, e deve
  # essere una modifica esplicita e reviewabile, non una sorpresa di un lunedi' mattina.
  FLUTTER_VERSION: '3.47.0'
  # package.json dichiara engines.node >= 22.13.0. La linea 22 e' quella LTS attiva.
  NODE_VERSION: '22'
  # Evita che Next stampi il banner della telemetria e sporchi i log della build.
  NEXT_TELEMETRY_DISABLED: '1'

# NOTA SUL PARALLELISMO: nessun job dichiara `needs`, quindi girano tutti insieme.
# E' voluto: sono controlli indipendenti e mettere in serie, ad esempio, la build Android
# dopo i test non aggiungerebbe informazione, allungherebbe solo il tempo di feedback.
jobs:
  # ---------------------------------------------------------------------------
  # Intercetta: errori e warning dell'analizzatore Dart, regressioni sui 16 test di
  # modelli/formazioni, e codice non formattato che altrimenti genera diff rumorosi in
  # review (righe toccate solo perche' l'IDE di qualcun altro riformatta).
  # E' il job piu' veloce della pipeline, quindi da' il primo segnale utile.
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (analyze, test, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Mette in cache l'SDK Flutter (e la pub-cache che l'action gli associa):
          # scaricare ~1GB di SDK a ogni run e' lo spreco piu' grosso evitabile qui.
          cache: true

      # Esplicito invece di lasciarlo fare implicitamente ad analyze/test: se la
      # risoluzione delle dipendenze fallisce (lock incoerente, pacchetto sparito da
      # pub.dev) l'errore si vede su uno step dedicato invece che sepolto in altro output.
      - name: Risolvi le dipendenze
        working-directory: mobile
        run: flutter pub get

      # Senza flag di tolleranza, quindi anche le segnalazioni di livello `info` (i lint
      # di flutter_lints piu' `unawaited_futures` e `cancel_subscriptions` aggiunti in
      # mobile/analysis_options.yaml) fanno fallire il job. E' sostenibile perche' l'albero
      # e' pulito: `flutter analyze` oggi esce con "No issues found!". Partire da zero
      # segnalazioni e' l'unico modo per cui un gate del genere resti credibile — se un
      # domani il debito si riaccumula, la scorciatoia e' `--no-fatal-infos`, ma vale la
      # pena resistere: e' proprio la soglia zero che impedisce al debito di ricrescere.
      - name: Analisi statica
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      # Solo `lib` e `test`: le altre directory del progetto Flutter (android, ios, web,
      # build) contengono codice generato dai template o dai tool, che non ha senso
      # tenere allineato al formatter e che verrebbe riformattato a ogni `flutter create`.
      # `--output=none` fa il controllo senza riscrivere i file, `--set-exit-if-changed`
      # trasforma "ci sarebbe qualcosa da riformattare" in un fallimento.
      - name: Formattazione
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test

  # ---------------------------------------------------------------------------
  # Intercetta: lint rotti, errori di tipo TypeScript e — soprattutto — le rotture che si
  # vedono solo a build time in Next 16 (prerender di una pagina che esplode, import
  # server-only finito in un componente client, route handler con firma sbagliata).
  # `npm run typecheck` da solo NON le vede: `tsc --noEmit` non esegue il prerender.
  # ---------------------------------------------------------------------------
  pwa:
    name: PWA (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cache del tarball npm basata su package-lock.json: `npm ci` continua a
          # ricostruire node_modules da zero (che e' il punto di `ci`), ma senza riscaricare.
          cache: npm

      # `npm ci` e non `npm install`: installa esattamente cio' che dice package-lock.json
      # e fallisce se lock e package.json divergono. E' proprio la divergenza che vogliamo
      # far emergere in CI invece che in produzione.
      - name: Installa le dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      # ORDINE OBBLIGATO: build PRIMA di typecheck, non e' una preferenza stilistica.
      # `next build` genera .next/types/, che tsconfig.json include e da cui arrivano i
      # tipi globali sintetizzati da Next (`LayoutProps`, `PageProps`, ...). Su un
      # checkout pulito — cioe' sempre, in CI — invertire i due passi fa fallire tsc con
      # "TS2304: Cannot find name 'LayoutProps'" in src/app/layout.tsx. In locale il bug
      # non si vede, perche' una `.next/` di una build precedente resta sul disco e i
      # tipi ci sono gia': e' esattamente il genere di rottura che esiste solo in CI e
      # che questa pipeline serve a intercettare. (Verificato: prima riproducendo il
      # fallimento con `rm -rf .next && npx tsc --noEmit`, poi confermando che con la
      # build davanti torna verde.)
      #
      # NESSUN file .env viene creato qui, ed e' verificato: la build gira a env vuoto.
      # Il motivo e' che il codice non legge mai le variabili Supabase a build time —
      # src/lib/env.ts espone `hasSupabaseEnv()` come guardia e `getSupabaseEnv()` lancia
      # solo quando viene davvero chiamato a runtime, mentre src/config/site.ts ha un
      # fallback su http://localhost:3000 per NEXT_PUBLIC_APP_URL. Se un giorno qualcuno
      # aggiunge una pagina che legge una env obbligatoria durante il prerender, questo
      # job diventa rosso: ed e' il comportamento giusto, perche' significa che la build
      # ha smesso di essere riproducibile senza credenziali.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # IL JOB PIU' IMPORTANTE DELLA PIPELINE.
  # Intercetta la classe di bug che ha gia' rotto la build due volte: dipendenze native
  # Android incompatibili (flutter_secure_storage che chiamava un'API Android inesistente,
  # workmanager incompatibile con AGP 9). Entrambi i casi erano COMPLETAMENTE INVISIBILI a
  # `flutter analyze` e ai test, perche' il problema non e' nel codice Dart: sta nel
  # manifest merge, nella compilazione Kotlin/Java dei plugin e nella risoluzione dei
  # plugin Gradle. L'unico modo per vederli e' fare una build vera.
  # Build di debug e non release: salta R8/minificazione (che qui non aggiungerebbero
  # segnale) ma attraversa comunque tutta la configurazione Gradle, la compilazione dei
  # plugin e il manifest merge, cioe' esattamente dove si rompeva.
  # Nessuna build iOS: i runner macOS sono 10x piu' lenti e costosi, e il valore aggiunto
  # su un progetto senza codice nativo iOS custom non lo giustifica.
  # ---------------------------------------------------------------------------
  android-build:
    name: Android (APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # JDK 21: mobile/android/app/build.gradle.kts fissa source/targetCompatibility e
      # jvmTarget a 17, ma quello e' il BYTECODE prodotto, non la JVM che esegue Gradle.
      # Gradle 9.3.1 + AGP 9.1.0 + Kotlin 2.4.0 richiedono una JVM moderna, e 21 e' la LTS
      # allineata a quella usata in locale. Va tenuta >= 17 e coerente con l'ambiente di
      # sviluppo: un JDK diverso e' una fonte classica di "sul mio Mac compila".
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cache Gradle. La chiave include i file di build, il wrapper e pubspec.lock perche'
      # sono esattamente gli input che cambiano le dipendenze da scaricare; `restore-keys`
      # fa comunque partire da una cache parziale quando la chiave esatta non c'e',
      # evitando di riscaricare tutto per un bump di una singola libreria.
      # gradle-wrapper.properties e gradle.properties sono elencati a parte: il pattern
      # `*.gradle*` non li matcha, perche' nessuno dei due contiene la stringa ".gradle"
      # nel nome. Senza citarli, cambiare la versione di Gradle o i jvmargs non
      # invaliderebbe la cache.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Flutter 3.47 punta a compileSdk/targetSdk 36. L'immagine ubuntu dei runner include
      # gia' l'Android SDK, ma non c'e' garanzia che abbia sempre proprio la platform 36:
      # installarla esplicitamente trasforma un errore Gradle criptico in un messaggio
      # chiaro di sdkmanager. Lo step non e' bloccante di proposito (`|| echo warning`),
      # perche' quando la platform c'e' gia' o AGP la scarica da solo il build funziona
      # comunque e non vogliamo far fallire la pipeline per un dettaglio di provisioning.
      # NDK: build.gradle.kts imposta `ndkVersion = flutter.ndkVersion` (28.2.13676358).
      # Lo lasciamo scaricare ad AGP su richiesta invece di forzarlo qui, perche' e' ~1GB
      # e non tutte le build lo toccano. Se il primo run reale fallisce lamentando l'NDK,
      # aggiungere "ndk;28.2.13676358" alla riga di sdkmanager qui sotto.
      - name: Prepara l'Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager non trovato in $SDKMANAGER; lascio che sia AGP a risolvere i componenti mancanti."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null \
            || echo "::warning::Installazione di platforms;android-36 fallita; proseguo e lascio provare ad AGP."

      # PERCHE' VALORI FINTI BASTANO, E PERCHE' NON POSSIAMO USARE QUELLI VERI.
      # mobile/config.local.json e' gitignorato (contiene le chiavi Supabase reali) e non
      # esiste sul runner. I suoi valori finiscono nel binario tramite
      # `String.fromEnvironment` in lib/core/config/app_config.dart, cioe' sono COSTANTI DI
      # COMPILAZIONE: al compilatore serve solo che esistano e siano stringhe, non che
      # puntino a un backend raggiungibile. Non c'e' nessuna chiamata di rete durante la
      # build, quindi un URL e una chiave sintatticamente plausibili producono esattamente
      # lo stesso risultato di compilazione di quelli veri.
      # Valori reali qui sarebbero comunque impossibili (niente secrets sulle PR da fork) e
      # sbagliati (finirebbero nei log pubblici di un repo pubblico): non metterceli mai.
      # Generiamo il file invece di passare quattro `--dart-define` anche per un secondo
      # motivo: cosi' il job esercita davvero il percorso `--dart-define-from-file`, quindi
      # un config.local.json malformato o una chiave rinominata verrebbero intercettati.
      - name: Genera una configurazione fittizia per la compilazione
        working-directory: mobile
        run: |
          cat > config.local.json <<'JSON'
          {
            "SUPABASE_URL": "https://ci-placeholder-not-a-real-project.supabase.co",
            "SUPABASE_PUBLISHABLE_KEY": "sb_publishable_ci_placeholder_value_not_a_real_key",
            "GOOGLE_SERVER_CLIENT_ID": "000000000000-ciplaceholderserver.apps.googleusercontent.com",
            "GOOGLE_IOS_CLIENT_ID": "000000000000-ciplaceholderios.apps.googleusercontent.com"
          }
          JSON

      - name: Risolvi le dipendenze
        working-directory: mobile
        run: flutter pub get

      # L'APK prodotto viene buttato via: non e' un artefatto da distribuire (e' firmato
      # con la chiave di debug), interessa solo il fatto che la compilazione arrivi in fondo.
      - name: Build APK di debug
        working-directory: mobile
        run: flutter build apk --debug --dart-define-from-file=config.local.json

  # ---------------------------------------------------------------------------
  # Intercetta: credenziali finite nel repo. Il rischio concreto qui non e' teorico:
  # mobile/config.local.json contiene chiavi Supabase reali ed e' gitignorato, quindi
  # basta un `git add -f` distratto (o un `git add -A` da una shell dove il .gitignore non
  # copre il path) per pubblicarle su un repository PUBBLICO. Un segreto committato su
  # repo pubblico va considerato compromesso nel giro di minuti: i bot che scandagliano
  # GitHub sono piu' veloci di qualunque review.
  # Job leggerissimo: non installa dipendenze del progetto, quindi da' il verdetto in
  # meno di un minuto.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Usiamo il binario ufficiale invece dell'action `gitleaks/gitleaks-action`, che per
      # gli account Organization richiede un secret GITLEAKS_LICENSE: sulle PR da fork i
      # secrets non esistono, quindi quell'action fallirebbe proprio nel caso che ci
      # interessa. Il binario non ha licenze ne' token da leggere.
      # Estraiamo in RUNNER_TEMP e non nel workspace: se il binario finisse nella
      # directory del repo, gitleaks scandirebbe anche se stesso.
      - name: Installa gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # `gitleaks dir` scandisce lo stato ATTUALE dell'albero, non la storia git. E' la
      # scelta giusta per un gate di PR: la domanda a cui rispondere e' "questo codice, se
      # lo mergiamo, contiene segreti?". Scandire la storia a ogni PR rimacinerebbe per
      # sempre gli stessi eventuali reperti storici, rendendo il job rosso in modo cronico
      # e quindi inutile. Nota: sul runner i file gitignorati non esistono (checkout pulito),
      # quindi il config.local.json locale non genera falsi positivi — mentre uno
      # committato per sbaglio, essendo tracciato, verrebbe trovato.
      # `--redact` e' obbligatorio: i log di un repo pubblico sono leggibili da chiunque,
      # e stampare in chiaro il segreto trovato lo esporrebbe una seconda volta.
      - name: Scansiona il working tree
        run: gitleaks dir . --no-banner --redact --verbose

  # ---------------------------------------------------------------------------
  # Intercetta: dipendenze npm con vulnerabilita' note introdotte da un aggiornamento del
  # lockfile. Oggi il progetto e' a 0 vulnerabilita', quindi partiamo da una baseline
  # pulita e qualunque segnalazione futura e' informazione nuova, non rumore ereditato.
  # Soglia `high`: sotto quel livello npm audit e' notoriamente rumoroso (avvisi su
  # dipendenze di sviluppo non raggiungibili a runtime) e un gate rumoroso viene ignorato.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Volutamente SENZA `npm ci`: `npm audit` risolve l'albero direttamente da
      # package-lock.json e interroga il registry, non gli serve node_modules. Saltare
      # l'installazione fa scendere il job da qualche minuto a pochi secondi.
      - name: Audit delle dipendenze
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Intercetta: modifiche a migrazioni GIA' APPLICATE in produzione.
  # Una migrazione applicata e' immutabile per definizione: Supabase tiene traccia di
  # quali file ha eseguito, quindi riscriverne uno non lo ri-esegue. Il risultato e' la
  # divergenza silenziosa peggiore che esista — il repo descrive uno schema, il database
  # reale ne ha un altro — e si scopre mesi dopo, quando qualcuno ricrea l'ambiente da
  # zero e ottiene uno schema diverso dalla produzione.
  # Aggiungere nuovi file va benissimo: e' l'unico modo corretto di cambiare lo schema.
  # ---------------------------------------------------------------------------
  migrations-check:
    name: Migrazioni immutabili
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Serve la storia completa: senza, `git merge-base` non ha abbastanza commit per
          # trovare il punto di divergenza fra il branch e la base.
          fetch-depth: 0

      - name: Verifica che nessuna migrazione esistente sia stata modificata
        env:
          # Passiamo i dati dell'evento tramite env e non interpolandoli dentro lo script:
          # e' la regola generale per non aprire un'iniezione di comandi via campi
          # controllabili da chi apre la PR. Su `push` questa variabile e' vuota.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Due contesti diversi:
          # - pull_request: la base e' il commit del branch di destinazione al momento
          #   dell'evento, fornito da GitHub.
          # - push su claude/**: non esiste una PR, quindi confrontiamo con origin/main.
          #   Se il fork non ha main (caso raro ma possibile), non c'e' nulla di sensato
          #   da confrontare e usciamo verdi con una nota invece di inventarci una base.
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_REF="$PR_BASE_SHA"
          elif git rev-parse --verify --quiet origin/main >/dev/null; then
            BASE_REF="origin/main"
          else
            echo "::notice::Nessuna base di confronto disponibile (niente PR e niente origin/main): controllo saltato."
            exit 0
          fi

          # merge-base e non il ref diretto: se main e' avanzato dopo che il branch e'
          # partito, un diff contro la punta di main segnalerebbe come "modificate" anche
          # migrazioni toccate da altri, che con questa PR non c'entrano nulla.
          MERGE_BASE="$(git merge-base "$BASE_REF" HEAD)"
          echo "Confronto supabase/migrations/ fra $MERGE_BASE e HEAD."

          # --diff-filter=MDRT: Modified, Deleted, Renamed, Type-changed. La 'A' (Added)
          # e' deliberatamente esclusa, perche' aggiungere una migrazione nuova e' il
          # flusso normale e deve restare libero.
          VIOLATIONS="$(git diff --name-status --diff-filter=MDRT "$MERGE_BASE" HEAD -- supabase/migrations/ || true)"

          if [ -n "$VIOLATIONS" ]; then
            echo "$VIOLATIONS" | while IFS= read -r line; do
              echo "::error::Migrazione gia' esistente modificata o rimossa: $line"
            done
            echo ""
            echo "Le migrazioni in supabase/migrations/ sono immutabili una volta applicate:"
            echo "Supabase non rie-esegue un file gia' registrato, quindi modificarlo fa"
            echo "divergere il repository dallo schema reale del database."
            echo "Per cambiare lo schema, aggiungi una NUOVA migrazione che applica la"
            echo "modifica sopra a quella vecchia."
            exit 1
          fi

          echo "Nessuna migrazione esistente e' stata modificata."
